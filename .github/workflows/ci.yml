name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -t . -v
      - name: Byte-compile
        run: python -m compileall -q placeswiki

  e2e:
    # Build a database offline, publish it, parse it with Google's messages,
    # then serve it and query it over HTTP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e .
          python -m pip install google-maps-places
      - name: Fixture database
        run: python examples/fixture_db.py /tmp/fixture.sqlite
      - name: Publish and verify
        run: |
          placeswiki publish --db /tmp/fixture.sqlite --out /tmp/bundle
          placeswiki verify --file /tmp/bundle/places.json \
            --photo-index /tmp/bundle/photos.json
      - name: Serve and query
        run: |
          placeswiki slim --db /tmp/fixture.sqlite --out /tmp/serve.sqlite
          placeswiki serve --db /tmp/serve.sqlite --port 8080 &
          sleep 3
          curl -sf -X POST http://127.0.0.1:8080/v1/places:searchNearby \
            -H "Content-Type: application/json" \
            -d '{"locationRestriction":{"circle":{"center":{"latitude":41.89,"longitude":12.49},"radius":2000}}}' \
            -o /tmp/nearby.json
          python -c "import json; d=json.load(open('/tmp/nearby.json')); assert d['places'], d; assert d['places'][0]['id'].startswith('wc:'); print('served', len(d['places']), 'places')"
          curl -sf http://127.0.0.1:8080/health

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build image
        run: docker build -t placeswiki .
      - name: Run it against a fixture database
        run: |
          python -m pip install -e .
          mkdir -p data
          python examples/fixture_db.py data/places.sqlite
          docker run -d --name places -p 8080:8080 -v "$PWD/data:/data" placeswiki
          sleep 4
          curl -sf http://127.0.0.1:8080/health
          curl -sf -X POST http://127.0.0.1:8080/v1/places:searchNearby \
            -H "Content-Type: application/json" \
            -d '{"locationRestriction":{"circle":{"center":{"latitude":41.89,"longitude":12.49},"radius":2000}}}' \
            -o /tmp/nearby.json
          python -c "import json; d=json.load(open('/tmp/nearby.json')); assert d['places']; print('docker served', len(d['places']), 'places')"
          docker logs places
          docker rm -f places

  google-compat:
    # The claim is "Google's parser accepts this". Here Google's parser proves it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install google-maps-places
      - name: Parse fixture with google.maps.places_v1
        run: |
          python -m placeswiki verify \
            --file tests/fixtures/google-payload.json \
            --photo-index tests/fixtures/google-photo-index.json
      - name: Verify tests (not skipped here)
        run: python -m unittest tests.test_verify -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
